services:
  - type: web
    name: jogos-dashboard
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests dependency:copy-dependencies -DoutputDirectory=target/dependency
    startCommand: java -cp target/classes:target/dependency/* app.web.WebServer
    healthCheckPath: /
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false